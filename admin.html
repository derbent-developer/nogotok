<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель управления · НОГОТОК</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=202609100215">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
</head>
<body>

<!-- ------------------------------------------------------------ вход -->
<div class="login-wrap" id="login">
  <form class="login-card" id="login-form">
    <div class="brand">НОГОТОК</div>
    <div class="sub">панель управления</div>
    <div class="f">
      <label class="lbl">Ключ доступа GitHub</label>
      <input class="inp" type="password" id="password" placeholder="github_pat_..." autocomplete="off" autofocus>
    </div>
    <label class="switch" style="margin-bottom:16px">
      <input type="checkbox" id="remember" checked> Запомнить на этом устройстве
    </label>
    <button class="btn" style="width:100%" type="submit" id="login-btn">Войти</button>
    <div class="hint" style="margin-top:16px">
      Ключ доступа выдаётся один раз в настройках GitHub и заменяет пароль.
      Никому его не передавайте.
      <a href="#" id="help-link" style="text-decoration:underline">Как получить ключ</a>
    </div>

    <div class="hint" id="login-error" style="color:var(--sale);display:none"></div>
    <div class="hint" style="margin-top:10px"><a href="index.html" style="text-decoration:underline">← Вернуться в магазин</a></div>
  </form>
</div>

<!-- ---------------------------------------------------------- панель -->
<div class="layout hidden" id="panel">
  <aside class="side">
    <div class="brand">НОГОТОК<small>панель управления</small></div>
    <nav id="nav">
      <button data-tab="products">Товары <span class="n" id="n-products">0</span></button>
      <button data-tab="categories">Категории <span class="n" id="n-categories">0</span></button>
      <button data-tab="orders">Заказы <span class="n" id="n-orders">0</span></button>
      <button data-tab="settings">Настройки магазина</button>
      <button data-tab="security">Безопасность</button>
    </nav>
    <div class="foot">
      <a href="index.html" target="_blank">↗ Открыть магазин</a>
      <a href="#" id="logout">Выйти</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="publish idle" id="publish"></div>
    <main class="main" id="view"></main>
  </div>
</div>

<div class="back" id="back"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=202609100215"></script>
<script src="js/admin.js?v=202609100215"></script>
</body>
</html>
